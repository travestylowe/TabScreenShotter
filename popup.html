<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      padding: 16px;
      font-family: system-ui, sans-serif;
      font-size: 14px;
    }
    h1 {
      font-size: 16px;
      margin: 0 0 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      cursor: pointer;
      border: 1px solid #ccc;
      border-radius: 4px;
      background: #1a73e8;
      color: #fff;
      margin-bottom: 8px;
    }
    button:disabled {
      background: #94c4f7;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 13px;
      color: #333;
    }
    #progress {
      margin-top: 8px;
      font-size: 12px;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>TabScreenShotter</h1>
  <button id="startBtn">Start Capture</button>
  <div id="status"></div>
  <div id="progress"></div>
  <script src="popup.js"></script>
</body>
</html>
